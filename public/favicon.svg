<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- warm background -->
  <rect width="32" height="32" rx="6" fill="#ede8e0"/>
  <!-- strata bands: thinnest at bottom (oldest), thickest at top (newest) -->
  <rect x="2" y="27" width="28" height="3"  rx="1.5" fill="#3d2514"/>
  <rect x="2" y="21" width="28" height="5"  rx="1.5" fill="#5e3a1c"/>
  <rect x="2" y="15" width="28" height="5"  rx="1.5" fill="#7d5530"/>
  <rect x="2" y="8"  width="28" height="6"  rx="1.5" fill="#a07548"/>
  <rect x="2" y="1"  width="28" height="6"  rx="1.5" fill="#c9a070"/>
</svg>
